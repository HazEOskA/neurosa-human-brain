name: TEMP-format staged NeurOSA smoke
on:
  push:
    branches:
      - fix/memory-natural-recall-e2e-20261028
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style(staging): prettier')"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: fix/memory-natural-recall-e2e-20261028
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.7.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/brain-api/src/server.ts apps/brain-api/src/staging-memory-smoke.ts
      - name: Save formatting only
        run: |
          set -euo pipefail
          git add -- apps/brain-api/src/server.ts apps/brain-api/src/staging-memory-smoke.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(staging): prettier normalize smoke integration"
          git push origin HEAD:refs/heads/fix/memory-natural-recall-e2e-20261028
