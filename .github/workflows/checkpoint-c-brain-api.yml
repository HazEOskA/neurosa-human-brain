name: walidacja-checkpointu-c-brain-api

on:
  pull_request:
    branches:
      - build/neurosa-hb-v0.1

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz gałąź kontrolną
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Złóż i zweryfikuj paczkę Checkpointu C
        run: |
          cat \
            .recovery/checkpoint-c/chunk-00.b64 \
            .recovery/checkpoint-c/chunk-01.b64 \
            .recovery/checkpoint-c/chunk-02.b64 \
            .recovery/checkpoint-c/chunk-03.b64 \
            .recovery/checkpoint-c/chunk-04-0.b64 \
            .recovery/checkpoint-c/chunk-04-1.b64 \
            .recovery/checkpoint-c/chunk-04-2.b64 \
            .recovery/checkpoint-c/chunk-04-3.b64 \
            .recovery/checkpoint-c/chunk-05.b64 \
            > /tmp/checkpoint-c.tar.gz.b64
          test "$(wc -c < /tmp/checkpoint-c.tar.gz.b64)" = "15284"
          base64 --decode /tmp/checkpoint-c.tar.gz.b64 > /tmp/checkpoint-c.tar.gz
          echo "a3c1fe1525edf9b3673fc1fd556935a7f11c3a33756550d5bce8f8f343cc829c  /tmp/checkpoint-c.tar.gz" | sha256sum -c -
          tar -tzf /tmp/checkpoint-c.tar.gz

      - name: Przygotuj czysty Checkpoint B
        run: |
          git fetch origin build/neurosa-hb-v0.1
          test "$(git rev-parse origin/build/neurosa-hb-v0.1)" = "1feb4d30f939969126a999fd1a48791fe165b631"
          git checkout --detach 1feb4d30f939969126a999fd1a48791fe165b631
          git clean -fdx
          tar -xzf /tmp/checkpoint-c.tar.gz

      - name: Włącz pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Uaktualnij lockfile dla nowego pakietu API
        run: pnpm install --lockfile-only

      - name: Instalacja zamrożonych zależności
        run: pnpm install --frozen-lockfile

      - name: Formatuj wyłącznie pliki Checkpointu C
        run: |
          pnpm exec prettier --write \
            package.json \
            tsconfig.json \
            vitest.config.ts \
            docs/NEUROSA_HB_BRAIN_API.md \
            packages/neurosa-brain-api/package.json \
            packages/neurosa-brain-api/src/index.ts \
            apps/brain-api/src/server.ts \
            tests/api/brain-api.test.ts

      - name: Zablokuj nieoczekiwane zmiany
        run: |
          git diff --name-only | grep -Ev '^(package\.json|pnpm-lock\.yaml|tsconfig\.json|vitest\.config\.ts|docs/NEUROSA_HB_BRAIN_API\.md|packages/neurosa-brain-api/package\.json|packages/neurosa-brain-api/src/index\.ts|apps/brain-api/src/server\.ts|tests/api/brain-api\.test\.ts)$' > /tmp/nieoczekiwane.txt || true
          test ! -s /tmp/nieoczekiwane.txt || { cat /tmp/nieoczekiwane.txt; exit 1; }

      - name: Pełna walidacja Checkpointu C
        run: |
          set -o pipefail
          {
            pnpm format:check
            pnpm lint
            pnpm typecheck
            pnpm test
            pnpm check
            pnpm compile
            pnpm build
            pnpm smoke
          } 2>&1 | tee /tmp/checkpoint-c-validation.log

      - name: Smoke prawdziwego procesu Brain API
        env:
          NEUROSA_API_TOKEN: lokalny-token-smoke-checkpoint-c-123456
          NEUROSA_API_PORT: "8765"
          NEUROSA_DATABASE_PATH: /tmp/neurosa-checkpoint-c.db
        run: |
          set -euo pipefail
          pnpm brain:api > /tmp/brain-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for proba in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/health > /tmp/brain-api-health.json; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent \
            -H "Authorization: Bearer $NEUROSA_API_TOKEN" \
            http://127.0.0.1:8765/api/v1/brain/status \
            > /tmp/brain-api-status.json
          grep -q '"brainId":"OsaBrain"' /tmp/brain-api-status.json
          grep -q '"ledgerValid":true' /tmp/brain-api-status.json

      - name: Utwórz pojedynczy commit Checkpointu C
        run: |
          git config user.name "OsaTechGPT Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            package.json \
            pnpm-lock.yaml \
            tsconfig.json \
            vitest.config.ts \
            docs/NEUROSA_HB_BRAIN_API.md \
            packages/neurosa-brain-api/package.json \
            packages/neurosa-brain-api/src/index.ts \
            apps/brain-api/src/server.ts \
            tests/api/brain-api.test.ts
          git commit -m "feat: dodaj lokalne Brain API i strumień zdarzeń"
          git rev-parse HEAD | tee /tmp/checkpoint-c-commit.txt
          git rev-parse HEAD^{tree} | tee /tmp/checkpoint-c-tree.txt

      - name: Opublikuj wyłącznie fast-forward
        run: |
          git fetch origin build/neurosa-hb-v0.1
          test "$(git rev-parse origin/build/neurosa-hb-v0.1)" = "1feb4d30f939969126a999fd1a48791fe165b631"
          git push origin HEAD:build/neurosa-hb-v0.1

      - name: Zapisz dowody
        if: always()
        run: |
          mkdir -p /tmp/dowody
          cp /tmp/checkpoint-c-validation.log /tmp/dowody/ 2>/dev/null || true
          cp /tmp/checkpoint-c-commit.txt /tmp/dowody/ 2>/dev/null || true
          cp /tmp/checkpoint-c-tree.txt /tmp/dowody/ 2>/dev/null || true
          cp /tmp/brain-api.log /tmp/dowody/ 2>/dev/null || true
          cp /tmp/brain-api-health.json /tmp/dowody/ 2>/dev/null || true
          cp /tmp/brain-api-status.json /tmp/dowody/ 2>/dev/null || true
          if test -f packages/neurosa-brain-api/src/index.ts; then
            tar -czf /tmp/dowody/checkpoint-c-validated-source.tar.gz \
              package.json pnpm-lock.yaml tsconfig.json vitest.config.ts \
              docs/NEUROSA_HB_BRAIN_API.md \
              packages/neurosa-brain-api \
              apps/brain-api \
              tests/api/brain-api.test.ts
            sha256sum /tmp/dowody/checkpoint-c-validated-source.tar.gz > /tmp/dowody/SHA256SUMS
          fi

      - name: Opublikuj dowody walidacji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurosa-checkpoint-c-validation
          path: /tmp/dowody/
          if-no-files-found: warn
