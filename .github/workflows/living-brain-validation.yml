name: Living Brain 3D — validation

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/living-brain-3d-main
  pull_request:
    branches:
      - main
    paths:
      - "apps/brain-web/**"
      - "packages/neurosa-brain-visualization/**"
      - "tests/ui/**"
      - "tests/localization/**"
      - "docs/NEUROSA_HB_LIVING_BRAIN_3D.md"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.7.0
      - name: Zainstaluj zamrożone zależności
        run: pnpm install --frozen-lockfile
      - name: Pełna walidacja repo
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm check
          pnpm compile
          pnpm build
          pnpm smoke
      - name: Smoke Żywego Mózgu
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @neurosa/brain-web start --hostname 127.0.0.1 --port 3000 > /tmp/brain-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 80); do
            if curl --fail --silent http://127.0.0.1:3000 > /tmp/brain-web.html; then
              break
            fi
            sleep 0.25
          done
          grep -q "Żywy mózg agentów" /tmp/brain-web.html
