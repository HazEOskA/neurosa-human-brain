name: TEMP — format memory recall changes only

on:
  push:
    branches: [fix/memory-natural-recall-e2e-20261028]

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style(memory): prettier')"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: fix/memory-natural-recall-e2e-20261028
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.7.0
      - run: pnpm install --frozen-lockfile
      - name: Format only the two reviewed files
        run: pnpm exec prettier --write packages/neurosa-workspace/src/knowledge.ts tests/integration/natural-memory-recall.test.ts
      - name: Commit guarded formatting only
        run: |
          set -euo pipefail
          git add -- packages/neurosa-workspace/src/knowledge.ts tests/integration/natural-memory-recall.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "style(memory): prettier normalized recall implementation and tests"
          git push origin HEAD:refs/heads/fix/memory-natural-recall-e2e-20261028
