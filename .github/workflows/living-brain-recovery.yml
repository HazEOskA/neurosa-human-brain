name: Living Brain Recovery — finalize

on:
  push:
    branches:
      - recovery/living-brain-3d-main
    paths:
      - .github/workflows/living-brain-recovery.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.7.0
      - name: Zaktualizuj lockfile Living Brain
        run: pnpm install --lockfile-only
      - name: Sformatuj wyłącznie zakres recovery
        run: |
          pnpm exec prettier --write \
            apps/brain-web \
            packages/neurosa-brain-visualization \
            tests/ui/brain-visualization.test.ts \
            tests/localization/polish-ui.test.ts \
            docs/NEUROSA_HB_LIVING_BRAIN_3D.md \
            tsconfig.json \
            vitest.config.ts \
            pnpm-lock.yaml
      - name: Zapisz deterministyczne pliki recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OsaTechGPT Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/brain-web \
            packages/neurosa-brain-visualization \
            tests/ui/brain-visualization.test.ts \
            tests/localization/polish-ui.test.ts \
            docs/NEUROSA_HB_LIVING_BRAIN_3D.md \
            tsconfig.json \
            vitest.config.ts \
            pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Zakres recovery jest już znormalizowany."
            exit 0
          fi
          git commit -m "chore: normalize Living Brain recovery sources"
          git push origin HEAD:recovery/living-brain-3d-main

# recovery-format-pass
