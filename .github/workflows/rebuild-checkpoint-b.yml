name: odbudowa-checkpointu-b

on:
  pull_request:
    branches:
      - build/neurosa-hb-v0.1

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz gałąź kontrolną
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Złóż i zweryfikuj paczkę odbudowy
        run: |
          cat \
            .recovery/checkpoint-b/chunk-00.b64 \
            .recovery/checkpoint-b/chunk-01-0.b64 \
            .recovery/checkpoint-b/chunk-01-1.b64 \
            .recovery/checkpoint-b/chunk-01-2.b64 \
            .recovery/checkpoint-b/chunk-01-3.b64 \
            .recovery/checkpoint-b/chunk-02.b64 \
            .recovery/checkpoint-b/chunk-03.b64 \
            .recovery/checkpoint-b/chunk-04.b64 \
            .recovery/checkpoint-b/chunk-05.b64 \
            .recovery/checkpoint-b/chunk-06.b64 \
            > /tmp/checkpoint-b.tar.gz.b64
          test "$(wc -c < /tmp/checkpoint-b.tar.gz.b64)" = "23000"
          base64 --decode /tmp/checkpoint-b.tar.gz.b64 > /tmp/checkpoint-b.tar.gz
          echo "e375cce1551a6dd07ac58c8bc58ef35531b5703bbd7f2aff229ec5f78ce50f39  /tmp/checkpoint-b.tar.gz" | sha256sum -c -
          tar -tzf /tmp/checkpoint-b.tar.gz

      - name: Przygotuj czystą bazę Checkpointu A
        run: |
          git fetch origin build/neurosa-hb-v0.1
          test "$(git rev-parse origin/build/neurosa-hb-v0.1)" = "ab7dca3484f6488373008c5f608ccadd1a347391"
          git checkout --detach ab7dca3484f6488373008c5f608ccadd1a347391
          git clean -fdx
          tar -xzf /tmp/checkpoint-b.tar.gz

      - name: Włącz pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Instalacja zamrożonych zależności
        run: pnpm install --frozen-lockfile

      - name: Formatuj wyłącznie pliki Checkpointu B
        run: |
          pnpm exec prettier --write \
            README.md \
            docs/NEUROSA_HB_OBSIDIAN_IMPORT.md \
            packages/neurosa-cli/src/index.ts \
            packages/neurosa-runtime-domain/src/index.ts \
            packages/neurosa-storage/package.json \
            packages/neurosa-storage/src/obsidian-import.ts \
            tests/import/obsidian-import.test.ts \
            tsconfig.json \
            vitest.config.ts

      - name: Zablokuj nieoczekiwane zmiany
        run: |
          git diff --name-only | grep -Ev '^(README\.md|docs/NEUROSA_HB_OBSIDIAN_IMPORT\.md|packages/neurosa-cli/src/index\.ts|packages/neurosa-runtime-domain/src/index\.ts|packages/neurosa-storage/package\.json|packages/neurosa-storage/src/obsidian-import\.ts|tests/import/obsidian-import\.test\.ts|tsconfig\.json|vitest\.config\.ts)$' > /tmp/nieoczekiwane.txt || true
          test ! -s /tmp/nieoczekiwane.txt || { cat /tmp/nieoczekiwane.txt; exit 1; }

      - name: Pełna walidacja Checkpointu B
        run: |
          set -o pipefail
          {
            pnpm format:check
            pnpm lint
            pnpm typecheck
            pnpm test
            pnpm check
            pnpm compile
            pnpm build
            pnpm smoke
          } 2>&1 | tee /tmp/checkpoint-b-validation.log

      - name: Utwórz pojedynczy commit Checkpointu B
        run: |
          git config user.name "OsaTechGPT Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            README.md \
            docs/NEUROSA_HB_OBSIDIAN_IMPORT.md \
            packages/neurosa-cli/src/index.ts \
            packages/neurosa-runtime-domain/src/index.ts \
            packages/neurosa-storage/package.json \
            packages/neurosa-storage/src/obsidian-import.ts \
            tests/import/obsidian-import.test.ts \
            tsconfig.json \
            vitest.config.ts
          git commit -m "feat: dodaj jednorazowy import Obsidiana do natywnego mózgu"
          git rev-parse HEAD | tee /tmp/checkpoint-b-commit.txt
          git rev-parse HEAD^{tree} | tee /tmp/checkpoint-b-tree.txt

      - name: Opublikuj wyłącznie fast-forward
        run: |
          git fetch origin build/neurosa-hb-v0.1
          test "$(git rev-parse origin/build/neurosa-hb-v0.1)" = "ab7dca3484f6488373008c5f608ccadd1a347391"
          git push origin HEAD:build/neurosa-hb-v0.1

      - name: Zapisz dowody
        if: always()
        run: |
          mkdir -p /tmp/dowody
          cp /tmp/checkpoint-b-validation.log /tmp/dowody/ 2>/dev/null || true
          cp /tmp/checkpoint-b-commit.txt /tmp/dowody/ 2>/dev/null || true
          cp /tmp/checkpoint-b-tree.txt /tmp/dowody/ 2>/dev/null || true
          if test -f packages/neurosa-storage/src/obsidian-import.ts; then
            tar -czf /tmp/dowody/checkpoint-b-validated-source.tar.gz \
              README.md \
              docs/NEUROSA_HB_OBSIDIAN_IMPORT.md \
              packages/neurosa-cli/src/index.ts \
              packages/neurosa-runtime-domain/src/index.ts \
              packages/neurosa-storage/package.json \
              packages/neurosa-storage/src/obsidian-import.ts \
              tests/import/obsidian-import.test.ts \
              tsconfig.json \
              vitest.config.ts
            sha256sum /tmp/dowody/checkpoint-b-validated-source.tar.gz > /tmp/dowody/SHA256SUMS
          fi

      - name: Opublikuj dowody walidacji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurosa-checkpoint-b-validation
          path: /tmp/dowody/
          if-no-files-found: warn
